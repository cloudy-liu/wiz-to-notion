name: Release Binary

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-release-binary:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x64
            binary_name: wiz-to-notion.exe
          - runner: ubuntu-latest
            platform: linux-x64
            binary_name: wiz-to-notion
          - runner: macos-13
            platform: macos-x64
            binary_name: wiz-to-notion

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -q

      - name: Build single-file CLI
        run: |
          pyinstaller --clean --noconfirm --onefile --name wiz-to-notion src/wiz_to_notion/__main__.py

      - name: Smoke test binary
        shell: pwsh
        run: |
          $binaryPath = Join-Path "dist" "${{ matrix.binary_name }}"
          if ("${{ matrix.binary_name }}" -ne "wiz-to-notion.exe") {
            chmod +x $binaryPath
          }
          & $binaryPath --help | Out-Null

      - name: Package release archive
        shell: pwsh
        env:
          ARCHIVE_PATH: release/wiz-to-notion-${{ github.event.release.tag_name }}-${{ matrix.platform }}.zip
          BINARY_NAME: ${{ matrix.binary_name }}
        run: |
          New-Item -ItemType Directory -Force -Path "release" | Out-Null
          @'
          from __future__ import annotations

          import os
          import time
          import zipfile
          from pathlib import Path

          archive_path = Path(os.environ["ARCHIVE_PATH"])
          binary_name = os.environ["BINARY_NAME"]
          files = [
              (Path("dist") / binary_name, binary_name),
              (Path(".env.example"), ".env.example"),
          ]

          with zipfile.ZipFile(archive_path, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              for source_path, archive_name in files:
                  stat = source_path.stat()
                  zip_info = zipfile.ZipInfo(archive_name)
                  zip_info.date_time = time.localtime(stat.st_mtime)[:6]
                  zip_info.compress_type = zipfile.ZIP_DEFLATED
                  zip_info.external_attr = (stat.st_mode & 0xFFFF) << 16
                  with source_path.open("rb") as source_file:
                      archive.writestr(zip_info, source_file.read())
          '@ | python -

          "RELEASE_ARCHIVE=$env:ARCHIVE_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_ARCHIVE_NAME=$(Split-Path $env:ARCHIVE_PATH -Leaf)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload archive to GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $uploadUrl = "${{ github.event.release.upload_url }}" -replace "\{\?name,label\}$", ""
          $assetsUrl = "${{ github.event.release.assets_url }}"
          $archivePath = $env:RELEASE_ARCHIVE
          $archiveName = $env:RELEASE_ARCHIVE_NAME
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $existingAssets = Invoke-RestMethod -Method Get -Headers $headers -Uri $assetsUrl
          $existingAsset = $existingAssets | Where-Object { $_.name -eq $archiveName } | Select-Object -First 1

          if ($null -ne $existingAsset) {
            Invoke-RestMethod `
              -Method Delete `
              -Headers $headers `
              -Uri "https://api.github.com/repos/${{ github.repository }}/releases/assets/$($existingAsset.id)"
          }

          Invoke-WebRequest `
            -Method Post `
            -Headers $headers `
            -ContentType "application/zip" `
            -InFile $archivePath `
            -Uri ("{0}?name={1}" -f $uploadUrl, [System.Uri]::EscapeDataString($archiveName))
